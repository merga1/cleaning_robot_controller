# Runtime settings for the CleanBot bring-up stack.
cleanbot_hardware_driver:
  ros__parameters:
    serial_port: /dev/serial0
    baudrate: 115200
    robot_id: robot-alpha-01
    wheel_radius: 0.065
    wheel_separation: 0.34
    ticks_per_revolution: 1320.0
    odom_frame: odom
    base_frame: base_link
    cmd_vel_topic: /cmd_vel
    odom_topic: /odom
    battery_topic: /battery_state
    status_topic: /cleanbot/status
    hardware_command_topic: /cleanbot/hardware_command
    estop_topic: /cleanbot/estop
    publish_rate: 30.0
    status_rate: 2.0
    command_timeout: 0.6
    max_linear_speed: 0.55
    max_angular_speed: 1.8
    battery_min_voltage: 9.6
    battery_max_voltage: 12.6
    battery_cells: 3
    reconnect_interval: 2.0

robot_state_publisher:
  ros__parameters:
    use_sim_time: false
    robot_description_uses_tf_prefix: false

joint_state_publisher:
  ros__parameters:
    use_sim_time: false
    rate: 20
